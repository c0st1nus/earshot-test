[package]
name = "earshot-vad"
version = "0.1.0"
edition = "2021"

[dependencies]
earshot = "1.2.1"
hound = "3.5"
sysinfo = "0.39.6"
cpal = "0.15"
ctrlc = { version = "3.4", features = ["termination"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# Если ort реально не используется напрямую, его можно убрать.
# Но если earshot/onnx runtime требует его рядом, оставьте.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
ndarray = "0.15"

[lib]
name = "vad_core"
path = "src/lib.rs"

[[bin]]
name = "vad-realtime"
path = "src/bin/realtime.rs"

[[bin]]
name = "vad-bench"
path = "src/bin/bench.rs"
